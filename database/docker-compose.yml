services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: egcivic-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: egcivic
      POSTGRES_USER: egcivic_user
      POSTGRES_PASSWORD: egcivic_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egcivic_user -d egcivic"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: