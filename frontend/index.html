<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EG Civic Operations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply saved theme / language before first paint (no flash). Mirrors src/theme.js and src/i18n/index.js.
      try {
        var t = localStorage.getItem('egc.theme'); document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
        var l = localStorage.getItem('egc.lang') === 'en' ? 'en' : 'ar';
        document.documentElement.lang = l; document.documentElement.dir = l === 'en' ? 'ltr' : 'rtl';
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
