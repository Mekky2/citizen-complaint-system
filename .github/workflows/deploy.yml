name: Deploy

# dev        <- every merge to main
# staging    <- tag vX.Y.Z-rc.N
# production <- tag vX.Y.Z (manual approval via GitHub Environment)

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - run: echo "TODO deploy to dev (hosting target not chosen yet)"

  deploy-staging:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-rc')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - run: echo "TODO deploy ${{ github.ref_name }} to staging"

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: echo "TODO deploy ${{ github.ref_name }} to production"
